services:

# FRONTEND

  gateway:
    container_name: gateway
    build:
      context: ./nginx
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - users_frontend
      - registration_frontend
      - users_svc
      - registration_svc
      - college_svc
      - dashboard_svc

  users_frontend:
    container_name: users_frontend
    build:
      context: .
      dockerfile: users_frontend/Dockerfile
    expose:
      - "5000"

  registration_frontend:
    container_name: registration_frontend
    build:
      context: .
      dockerfile: registration_frontend/Dockerfile
    expose:
      - "5000"

# BACKEND

  registration_svc:
    container_name: registration_svc
    build:
      context: .
      dockerfile: registration_svc/Dockerfile
    ports:
      - "5050:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:password@users_db:27017/
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - MONGO_DB_NAME=users_db
      - MONGO_COLLECTION_NAME=users
      - COLLEGE_API_URL=http://college_svc:5000
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=noreply@tutorplatform.test
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      mailpit:
        condition: service_started
      users_db:
        condition: service_healthy

  users_svc:
    container_name: users_svc
    build:
      context: ./users_svc
      dockerfile: Dockerfile
    ports:
      - "5051:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:password@users_db:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - MONGO_DB_NAME=users_db
      - MONGO_COLLECTION_NAME=users
    depends_on:
      users_db:
        condition: service_healthy

  college_svc:
    container_name: college_svc
    build:
      context: ./college_svc
      dockerfile: Dockerfile
    ports:
      - "5053:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - MONGO_URI=mongodb://admin:password@college_db:27017/
      - MONGO_DB_NAME=college_db
      - MONGO_COLLECTION_NAME=colleges
      - USERS_API_URL=http://gateway/api/users
      - COLLEGE_SYNC_TOKEN=${COLLEGE_SYNC_TOKEN:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    depends_on:
      college_db:
        condition: service_healthy
      users_svc:
        condition: service_started
  lms_svc:
    build: ./lms_svc
    restart: unless-stopped
    expose:
      - "5000"
    environment: &lms_environment
      MONGO_URI: mongodb://admin:${LMS_DB_PASSWORD:-password}@lms_db:27017/?authSource=admin
      MONGO_DB_NAME: lms_db
      LMS_ENCRYPTION_KEY: ${LMS_ENCRYPTION_KEY:-}
      DEV_MODE: ${DEV_MODE:-false}
      LMS_PRIVATE_HOSTS: ${LMS_PRIVATE_HOSTS:-moodle.tutor.localhost}
      LMS_CA_FILE: ${LMS_CA_FILE:-}
      LMS_ALLOWED_HOSTS: ${LMS_ALLOWED_HOSTS:-}
      LMS_SYNC_TIMEZONE: ${LMS_SYNC_TIMEZONE:-Europe/Dublin}
      LMS_SYNC_HOUR: ${LMS_SYNC_HOUR:-2}
      USERS_API_URL: http://gateway/api/users
      COLLEGE_API_URL: http://college_svc:5000
      COLLEGE_SYNC_TOKEN: ${COLLEGE_SYNC_TOKEN:-}
    depends_on:
      lms_db:
        condition: service_healthy

  lms_worker:
    build: ./lms_svc
    command: ["python", "-m", "lms_svc.worker"]
    restart: unless-stopped
    environment: *lms_environment
    depends_on:
      lms_db:
        condition: service_healthy

  messaging_svc:
    container_name: messaging_svc
    build:
      context: ./messaging_svc
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./frontend_shared
    ports:
      - "5052:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:password@messaging_db:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - DASHBOARD_SHARED_SECRET=${DASHBOARD_SHARED_SECRET}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - MONGO_DB_NAME=messaging_db
      - MONGO_CHAT_COLLECTION_NAME=chats
      - MONGO_MESSAGE_COLLECTION_NAME=messages
      - MONGO_READ_STATE_COLLECTION_NAME=chatReadStates
      - SOCKETIO_CORS_ALLOWED_ORIGINS=${PUBLIC_BASE_URL:-*}
    depends_on:
      messaging_db:
        condition: service_healthy

  dashboard_svc:
    container_name: dashboard_svc
    build:
      context: ./dashboard_svc
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./frontend_shared
    ports:
      - "5055:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY}
      - DASHBOARD_SHARED_SECRET=${DASHBOARD_SHARED_SECRET}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - USERS_API_URL=http://users_svc:5000
      - COLLEGE_API_URL=http://college_svc:5000
      - MESSAGING_API_URL=http://messaging_svc:5000
      - LMS_API_URL=http://lms_svc:5000
      - MATCHING_API_URL=http://matching_svc:5000
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      users_svc:
        condition: service_started
      college_svc:
        condition: service_started
      messaging_svc:
        condition: service_started
      lms_svc:
        condition: service_started
  matching_svc:
    container_name: matching_svc
    build:
      context: ./matching_svc
      dockerfile: Dockerfile
    ports:
      - "5054:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:password@users_db:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - MONGO_DB_NAME=users_db
      - MONGO_COLLECTION_NAME=users
    depends_on:
      users_db:
        condition: service_healthy

# DATABASES

  lms_db:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${LMS_DB_PASSWORD:-password}
    volumes:
      - ./lms_svc/lms_db_data:/data/db
    ports:
      - "27020:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  users_db:
    container_name: users_db
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./users_svc/users_db_data:/data/db

  messaging_db:
    container_name: messaging_db
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./messaging_svc/messaging_db_data:/data/db

  college_db:
    container_name: college_db
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "27019:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./college_svc/college_db_data:/data/db

# TOOLS

  mongo-express:
    container_name: mongo-express
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=users_db
    depends_on:
      - users_db

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  mkdocs:
    image: python:3.11-slim
    working_dir: /docs
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    command: >
      sh -c "pip install -r requirements-docs.txt && mkdocs serve --dev-addr=0.0.0.0:8000"