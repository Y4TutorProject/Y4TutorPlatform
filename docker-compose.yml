services:
  gateway:
    container_name: gateway
    build:
      context: ./nginx
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - users_frontend
      - registration_frontend
      - users_svc
      - registration_svc
      - college_svc

  users_frontend:
    container_name: users_frontend
    build:
      context: .
      dockerfile: users_frontend/Dockerfile
    expose:
      - "5000"

  registration_frontend:
    container_name: registration_frontend
    build:
      context: .
      dockerfile: registration_frontend/Dockerfile
    expose:
      - "5000"

  registration_svc:
    container_name: registration_svc
    build:
      context: .
      dockerfile: registration_svc/Dockerfile
    ports:
      - "5050:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:password@users_db:27017/
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - MONGO_DB_NAME=users_db
      - MONGO_COLLECTION_NAME=users
      - COLLEGE_API_URL=http://college_svc:5000
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=noreply@tutorplatform.test
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      mailpit:
        condition: service_started
      users_db:
        condition: service_healthy

  users_svc:
    container_name: users_svc
    build:
      context: ./users_svc
      dockerfile: Dockerfile
    ports:
      - "5051:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:password@users_db:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - MONGO_DB_NAME=users_db
      - MONGO_COLLECTION_NAME=users
    depends_on:
      users_db:
        condition: service_healthy

  matching_svc:
    container_name: matching_svc
    build:
      context: ./matching_svc
      dockerfile: Dockerfile
    ports:
      - "5052:5000"
    environment:
      - FLASK_ENV=development
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    depends_on:
      users_db:
        condition: service_healthy

  college_svc:
    container_name: college_svc
    build:
      context: ./college_svc
      dockerfile: Dockerfile
    ports:
      - "5053:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - MONGO_URI=mongodb://admin:password@college_db:27017/
      - MONGO_DB_NAME=college_db
      - MONGO_COLLECTION_NAME=colleges
      - USERS_API_URL=http://gateway/api/users
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    depends_on:
      college_db:
        condition: service_healthy
      users_svc:
        condition: service_started

# DATABASES

  users_db:
    container_name: users_db
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./users_svc/users_db_data:/data/db

  college_db:
    container_name: college_db
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./college_svc/college_db_data:/data/db

# TOOLS

  messaging_svc:
    container_name: messaging_svc
    build:
      context: ./messaging_svc
      dockerfile: Dockerfile
    ports:
      - "5052:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:password@messaging_db:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - DASHBOARD_SHARED_SECRET=${DASHBOARD_SHARED_SECRET}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - MONGO_DB_NAME=messaging_db
      - MONGO_CHAT_COLLECTION_NAME=chats
      - MONGO_MESSAGE_COLLECTION_NAME=messages
      - MONGO_READ_STATE_COLLECTION_NAME=chatReadStates
    depends_on:
      messaging_db:
        condition: service_healthy

  messaging_db:
    container_name: messaging_db
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./messaging_svc/messaging_db_data:/data/db

  mongo-express:
    container_name: mongo-express
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=users_db
    depends_on:
      - users_db

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
