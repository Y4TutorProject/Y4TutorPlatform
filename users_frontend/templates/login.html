{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block page %}login{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block navigation %}{% endblock %}
{% block main %}
<main class="auth-screen" aria-labelledby="form-title">
  <h1 id="form-title">Sign in</h1>
  <div class="signin-content">
    <p id="form-status" class="alert alert-info" role="status" aria-live="polite" tabindex="-1" hidden></p>
    <form id="login-form" method="post" action="/login">
      <div class="auth-field">
        <label class="form-label" for="email">Email address</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      </div>
      <button class="btn btn-dark auth-submit" type="submit">Sign in</button>
    </form>
    <noscript><p class="alert alert-danger mt-3">Enable JavaScript to sign in.</p></noscript>
    <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
    <p class="auth-switch"><a href="/check-email">Resend verification email</a></p>
  </div>
</main>
{% endblock %}
