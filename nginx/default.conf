server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    # Resolve Compose service names again after containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $users_api http://users_svc:5000;
    set $registration_api http://registration_svc:5000;
    set $users_ui http://users_frontend:5000;
    set $registration_ui http://registration_frontend:5000;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / { return 302 /login; }
    location = /health { access_log off; return 200 "ok\n"; }

    location /api/users/ {
        rewrite ^/api/users/(.*)$ /$1 break;
        proxy_pass $users_api;
    }
    location /api/registration/ {
        rewrite ^/api/registration/(.*)$ /$1 break;
        proxy_pass $registration_api;
    }
    location = /login { proxy_pass $users_ui; }
    location = /account { proxy_pass $users_ui; }
    location /users/static/ { proxy_pass $users_ui; }
    location = /signup { proxy_pass $registration_ui; }
    location /registration/static/ { proxy_pass $registration_ui; }
    location / { return 404; }
}
