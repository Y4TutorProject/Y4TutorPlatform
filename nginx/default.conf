server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    # Resolve Compose service names again after containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $users_api http://users_svc:5000;
    set $registration_api http://registration_svc:5000;
    set $college_api http://college_svc:5000;
    set $lms_api http://lms_svc:5000;
    set $users_ui http://users_frontend:5000;
    set $registration_ui http://registration_frontend:5000;
    set $dashboard http://dashboard_svc:5000;
    set $messaging_api http://messaging_svc:5000;


    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / { return 302 /login; }
    location = /health { access_log off; return 200 "ok\n"; }

    location /api/users/ {
        rewrite ^/api/users/(.*)$ /$1 break;
        proxy_pass $users_api;
    }
    location /api/registration/ {
        rewrite ^/api/registration/(.*)$ /$1 break;
        proxy_pass $registration_api;
    }
    location /api/college/ {
        rewrite ^/api/college/(.*)$ /$1 break;
        proxy_pass $college_api;
    }
    location /api/lms/ {
        rewrite ^/api/lms/(.*)$ /$1 break;
        proxy_read_timeout 120s;
        proxy_pass $lms_api;
    }
    location /api/colleges/ {
        rewrite ^/api/colleges/(.*)$ /$1 break;
        proxy_pass $college_api;
    }
    location /api/dashboard/ {
        rewrite ^/api/dashboard/(.*)$ /$1 break;
        proxy_pass $dashboard;
    }
    location /dashboard/static/ {
        proxy_pass $dashboard;
    }
    location /api/messaging/ {
        rewrite ^/api/messaging/(.*)$ /$1 break;
        proxy_pass $messaging_api;
    }

    location /socket.io/ {
        proxy_pass $messaging_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location = /login { proxy_pass $users_ui; }
    location = /choose-username { proxy_pass $dashboard; }
    location = /account { proxy_pass $dashboard; }
    location = /preferences { proxy_pass $dashboard; }
    location /users/static/ { proxy_pass $users_ui; }
    location = /signup { proxy_pass $registration_ui; }
    location /signup/ { proxy_pass $registration_ui; }
    location = /check-email { proxy_pass $registration_ui; }
    location = /verify-email { proxy_pass $registration_ui; }
    location = /register-college { proxy_pass $registration_ui; }
    location /registration/static/ { proxy_pass $registration_ui; }
    # location /dashboard/static/ { proxy_pass $dashboard; }
    location = /admin-dashboard { proxy_pass $dashboard; }
    location = /dashboard { proxy_pass $dashboard; }
    location /messaging/static/ { proxy_pass $messaging_api; }
    location / { return 404; }
}
