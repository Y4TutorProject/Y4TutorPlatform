{% extends "base.html" %}

{% block title %}Messages{% endblock %}
{% block body_class %}bg-light text-dark{% endblock %}
{% block page %}chat{% endblock %}

{% block main %}

<script src="{{ url_for('static', filename='messaging.js') }}" defer></script>

<!-- Carries the chat to open on page load (empty if none) -->
<div
    id="chat-app"
    data-user-id="{{ user }}"
    data-open-chat-id="{{ openChat or '' }}"
></div>

<div class="container-fluid py-3">
    <div class="card shadow-lg border-0 overflow-hidden">

        <div class="row g-0" style="height: 80vh;">

            <!-- Chat List Sidebar -->
            <div class="col-lg-4 col-xl-3 border-end bg-white">

                <div class="p-3 border-bottom">
                    <h5 class="mb-0 fw-bold">Messages</h5>
                </div>

                <div
                    id="chat-list"
                    class="overflow-auto"
                    style="height: calc(80vh - 65px);"
                >
                    {% for chat in chats %}

                    <button
                        type="button"
                        class="btn w-100 text-start border-0 border-bottom rounded-0 p-3 chat-item"
                        id="chat-{{ chat.chatId }}"
                        data-chat-id="{{ chat.chatId }}"
                        data-display-name="{{ chat.displayName }}"
                    >
                        <div class="d-flex justify-content-between align-items-center">
                            <p class="mb-0 text-truncate fw-semibold">
                                <!-- show only the first 5 characters -->
                                {{ chat.displayName }}
                            </p>
                            
                            <small
                                class="last-time text-muted"
                                data-timestamp="{{ chat.timestamp }}"
                            >
                                {{ chat.timestamp }}
                            </small>
                        </div>

                        <div
                            class="last-msg small text-muted {% if chat.unread %}fw-bold text-dark{% endif %}"
                        >
                            {{ chat.lastMessage }}
                        </div>
                    </button>

                    {% endfor %}
                </div>

            </div>

            <!-- Main Chat Area -->
            <div class="col-lg-8 col-xl-9 d-flex flex-column bg-body-tertiary">

                <!-- Header -->
                <div
                    class="border-bottom bg-white p-3 d-flex align-items-center gap-3 flex-shrink-0"
                >
                    <div
                        class="rounded-circle bg-primary"
                        style="width:48px;height:48px;"
                    ></div>

                    <div>
                        <h5 class="mb-0 fw-bold" id="chat-header">
                            Select a chat
                        </h5>

                        <small
                            id="typing-indicator"
                            class="text-primary d-none"
                            aria-live="polite"
                        >
                            Typing...
                        </small>
                    </div>
                </div>

                <!-- Messages -->
                <div
                    id="conversation-area"
                    class="flex-grow-1 overflow-auto p-4"
                >
                    <ul
                        id="conversation-messages"
                        class="list-unstyled mx-auto mb-0"
                        style="max-width:900px;"
                    >
                    </ul>
                </div>

                <!-- Message input: always rendered, hidden until a chat is open -->
                <div id="message-box" class="border-top bg-white p-3 {% if not openChat %}d-none{% endif %}">
                    <div class="input-group">
                        <input
                            type="file"
                            id="file-upload"
                            multiple
                            hidden
                        >

                        <label
                            for="file-upload"
                            class="btn btn-outline-secondary"
                        >
                            Upload
                        </label>

                        <input
                            type="text"
                            id="message-input"
                            name="message"
                            placeholder="Type a message..."
                            class="form-control"
                        >

                        <button
                            type="button"
                            id="send-btn"
                            class="btn btn-primary"
                        >
                            Send
                        </button>
                    </div>
                </div>

                <!-- Shown until a chat is opened -->
                <div
                    id="no-chat-message"
                    class="text-center p-4 {% if openChat %}d-none{% endif %}"
                >
                    <p class="text-muted mb-0">
                        No chat selected
                    </p>
                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
