{% extends 'base.html' %}

{% block content %}
<div class="">
<link href="../static/styles/styles.css" rel="stylesheet">
<div class="w-full max-w-7xl min-h-screen mx-auto bg-white rounded-2xl shadow-xl flex">

    <div class="w-1/ border-r border-gray-200 flex flex-col bg-gray-50">

        <div class="p-5 border-b bg-white">
            <h1 class="text-xl ont-bold">Chat App</h1>
            <p class="text-sm text-gray-500">Welcome, {{ name }}</p>
        </div>

        <div id="chat-list" class="flex-1 overflow-y-auto">

            {% for chat in chats %}
            <a id="chat-{{ chat.chatId }}" data-chat-id="{{ chat.chatId }}" onclick="getMessages('{{ chat.displayName }}', '{{ chat.chatId }}')" class="block{% if chat.unread %} font-semibold{% endif %}">
                <div
                    class="flex items-center gap-4 px-4 py-3 cursor-pointer hover:bg-gray-100 transition-all border-b border-gray-100"
                >
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center">
                            <h2 class="font-semibold text-gray-800 truncate">
                                {{ chat.displayName }}
                            </h2>

                            <span class="last-time text-xs text-gray-400" data-timestamp="{{ chat.timestamp }}">
                                {{ chat.timestamp }}
                            </span>
                        </div>

                        <p class="last-msg text-sm text-gray-500 truncate{% if chat.unread %} font-semibold{% endif %}">
                            {{ chat.lastMessage }}
                        </p>
                    </div>
                </div>
            </a>
            {% endfor %}

        </div>

    </div>

    <!-- Main Chat -->
    <div class="flex-1 bg-gradient-to-b from-gray-50 to-white">

        <div class="h-full flex flex-col">
            <div class="border-b bg-white px-6 py-4 flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-500"></div>

                <div>
                    <h2 class="text-xl font-bold text-gray-800" id="chat-header">
                        Select a chat
                    </h2>
                    
        
                </div>
            </div>

            <!-- Empty Conversation Area -->
            <div id="conversation-area" class="flex-1 overflow-y-auto p-4 md:p-6">
                <ul id="conversation-messages" class="flex flex-col gap-3 max-w-4xl mx-auto">
                    
                </ul>
            </div>

            <div id="message-box" class="border-t border-gray-200 bg-white p-4 flex items-center gap-3">

    <!-- File Upload -->
    <label
        for="file-upload"
        class="flex h-10 w-15 cursor-pointer items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition"
        title="Attach file"
    >
     Upload File
    </label>

    <input
        type="file"
        id="file-upload"
        class="hidden"
        multiple
    />

    <!-- Message Input -->
    <input
        type="text"
        id="message-input"
        name="message"
        placeholder="Type a message..."
        class="flex-1 rounded-full border border-gray-300 bg-gray-50 px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
    />

    <!-- Send Button -->
    <button
        type="button"
        id="send-btn"
        onclick="sendMessage()"
        class="rounded-full bg-blue-600 px-5 py-3 text-white font-medium hover:bg-blue-700 transition"
    >
        Send
    </button>

            </div>
        </div>
    </div>
</div>

<script>
    let currentChatId = null;


    var socketio = io({ auth: { userId: "{{ user }}" } });
   socketio.on("message", function (msg) {
    updateChatSidebar(msg);
    if (String(msg.chatId) === String(currentChatId)) {
        markChatRead(msg.chatId);
        createChatItem(msg, document.getElementById("chat-header").innerText);
    }
});

function updateChatSidebar(msg) {
    const chatList = document.getElementById("chat-list");
    const chatEl = document.getElementById(`chat-${String(msg.chatId)}`);

    if (!chatList || !chatEl) {
        return;
    }

    const lastMessage = chatEl.querySelector(".last-msg");
    const lastTime = chatEl.querySelector(".last-time");
    if (lastMessage) {
        lastMessage.innerText = msg.message;
    }
    if (lastTime) {
        lastTime.innerText = formatChatTime(msg.timestamp);
    }
    if (String(msg.senderId) !== String("{{ user }}")
        && String(msg.chatId) !== String(currentChatId)) {
        chatEl.classList.add("font-semibold");
        if (lastMessage) {
            lastMessage.classList.add("font-semibold");
        }
    }
    chatList.prepend(chatEl);
}

function formatChatTime(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const isToday = date.toDateString() === now.toDateString();
    const isCurrentYear = date.getFullYear() === now.getFullYear();

    return isToday
        ? date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        : date.toLocaleDateString([], isCurrentYear
            ? { day: "numeric", month: "short" }
            : { day: "numeric", month: "short", year: "numeric" });
}

document.querySelectorAll(".last-time[data-timestamp]").forEach(lastTime => {
    lastTime.innerText = formatChatTime(lastTime.dataset.timestamp);
});

function markChatRead(chatId) {
    const chatEl = document.getElementById(`chat-${String(chatId)}`);
    if (!chatEl) {
        return;
    }

    fetch(`/mychats/chat/${String(chatId)}/read`, {
        method: "POST"
    }).catch(error => console.error("Unable to save read state:", error));

    chatEl.classList.remove("font-semibold");
    const lastMessage = chatEl.querySelector(".last-msg");
    if (lastMessage) {
        lastMessage.classList.remove("font-semibold");
    }
}

        function createChatItem(message, displayName) {
            const currentUserId = String("{{ user }}");
            const item = document.createElement("li");
            const bubble = document.createElement("div");
            const sender = String(message.senderId) === currentUserId ? "You" : displayName;

            item.className = "flex " +
                (String(message.senderId) === currentUserId ? "justify-end" : "justify-start");
            bubble.className = "max-w-md rounded-2xl px-4 py-2 " +
                (String(message.senderId) === currentUserId
                    ? "bg-blue-600 text-white"
                    : "bg-gray-200 text-gray-800");

            const senderLabel = document.createElement("p");
            senderLabel.className = "text-sm font-semibold mb-1";
            senderLabel.innerText = sender;

            const text = document.createElement("p");
            text.innerText = message.message;
            const metadata = document.createElement("small");
            metadata.className = "block mt-1 text-xs opacity-70";
            metadata.innerText = formatChatTime(message.timestamp);

            bubble.appendChild(senderLabel);
            bubble.appendChild(text);
            bubble.appendChild(metadata);
            item.appendChild(bubble);
            document.getElementById("conversation-messages").appendChild(item);
        }


        function getMessages(displayName, chatId) {
        
        if(currentChatId === chatId) {
            return; 
        }
        if(currentChatId) {
            // disconnect from prev chat 
            socketio.emit("leave_chat", { chatId: currentChatId, userId: sessionStorage.getItem("user") });
        }
        currentChatId = chatId;
        markChatRead(chatId);

        // Connect to the chat
        socketio.emit("join_chat", { chatId: chatId, userId: sessionStorage.getItem("user") });
        fetch('/mychats/chat/' + chatId, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            },
        }).then(response => {
            if (!response.ok) {
                throw new Error(`Unable to load chat (${response.status})`);
            }
            return response.json();
        })
        .then(data => {
            document.getElementById("chat-header").innerText = displayName;
            var messageBox = document.getElementById("conversation-messages");
            messageBox.innerHTML = "";
            data.forEach(message => {
                createChatItem(message, displayName);
            });
        })
        .catch(error => console.error("Chat message loading failed:", error));

    }

    function sendMessage() {
      var msgInput = document.getElementById("message-input");
      if (currentChatId === null || msgInput.value.trim() === "") return;
      var msg = msgInput.value;
      socketio.emit("message", { message: msg, chatId: currentChatId, senderId: sessionStorage.getItem("user"), timestamp: new Date().toISOString() });
      msgInput.value = "";
    }

    document.getElementById("message-input").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>
<script>
    // Store the user in sessionStorage for later use
    sessionStorage.setItem("user", "{{ user }}");
</script>
</div>
{% endblock %}
