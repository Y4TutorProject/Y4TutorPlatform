site_name: Tutoring App
site_description: Architecture and API documentation for the Tutoring App Platform.
repo_url: https://github.com/Y4TutorProject/Y4TutorPlatform
repo_name: Y4TutorProject/Y4TutorPlatform

docs_dir: docs

theme:
  name: readthedocs
  navigation_depth: 3

nav:
  - API:
      - Overview: api/README.md
      - OpenAPI specification: api/openapi.yaml
  - Setup:
      - Desktop and mobile PWA: setup/pwa.md
  - Architecture:
      - Colleges: architecture/colleges.md
      - Manual courses and modules: architecture/manual-academics.md
      - LMS integration: architecture/lms-integration.md
      - LMS adapters and mapping: architecture/lms-adapters.md
      - Matching system: architecture/matching-system.md
      - Messaging: architecture/messaging.md
      - Notifications: architecture/notifications.md
      - Users and registration: architecture/users.md
  - Decision log: decision-log.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
